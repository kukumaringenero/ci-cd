name: CI Pipeline # display name in the Actions tab

on: # WHEN the workflow runs
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: # adds a manual "Run workflow" button

env: # variables for the whole workflow
  NODE_VERSION: 20

jobs: # WHAT runs
  test: # job ID (you choose the name)
    runs-on: ubuntu-latest # which machine (runner)
    steps: # the ordered list of tasks
      - name: Checkout code
        uses: actions/checkout@v4 # use a prebuilt action

      - name: Setup Node
        uses: actions/setup-node@v4
        with: # inputs for that action
          node-version: ${{ env.NODE_VERSION }}

      - name: Install
        run: npm ci # run a shell command

      - name: Test
        run: npm test

  deploy:
    needs: test # wait for 'test' to pass first
    if: github.ref == 'refs/heads/master' # only run on master
    runs-on: ubuntu-latest
    environment: production # GitHub Environment (approvals, secrets)
    steps:
      - name: Deploy
        run: ./deploy.sh
        env:
          API_KEY: ${{ secrets.API_KEY }}
