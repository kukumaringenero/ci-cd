name: ci-test
on: [push, pull_request]

jobs:
  test-new:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # get the code
      - uses: actions/setup-node@v4 # install Node
        with:
          node-version: 20
      - run: npm install # install dependencies
      - run: npm test
